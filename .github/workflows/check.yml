name: check

# Type checks, the daemon's tests, the acceptance suite and the browser smoke checks (WebKit).
# It never deploys, never calls Claude and needs no secrets.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Pinned: Playwright's WebKit download for a newer Ubuntu stalled.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: WebKit for the smoke checks
        timeout-minutes: 12
        # The download can stall: each try gets four minutes.
        run: |
          for try in 1 2 3; do
            timeout 240 node node_modules/playwright-core/cli.js install --with-deps webkit && exit 0
            echo "try $try did not finish"
          done
          exit 1
      - name: Checks
        run: scripts/check.sh
        env:
          CHROME_PATH: /usr/bin/google-chrome
