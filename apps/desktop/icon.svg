<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- jin's app icon on the macOS grid: an 824px tile in a 1024 canvas, with the system-style drop shadow. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2629"/>
      <stop offset="1" stop-color="#121013"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".5">
      <stop offset="0" stop-color="#e48a3c" stop-opacity=".38"/>
      <stop offset=".6" stop-color="#c65c30" stop-opacity=".1"/>
      <stop offset="1" stop-color="#c65c30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heat" x1="0" y1="0" x2=".6" y2="1">
      <stop stop-color="#b9c2d6"/>
      <stop offset=".2" stop-color="#702d33"/>
      <stop offset=".4" stop-color="#c65c30"/>
      <stop offset=".55" stop-color="#f2c661"/>
      <stop offset=".7" stop-color="#d67930"/>
      <stop offset=".85" stop-color="#702d33"/>
      <stop offset="1" stop-color="#b9c2d6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <g clip-path="url(#clip)">
    <circle cx="512" cy="540" r="380" fill="url(#glow)"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g transform="translate(512 512) scale(8.6) translate(-32 -32)" filter="url(#soft)">
    <path fill="url(#heat)" d="M32 5C45 2 51 14 55 26S62 43 49 53S22 61 12 49S3 30 12 20S21 7 32 5Z"/>
  </g>
</svg>
